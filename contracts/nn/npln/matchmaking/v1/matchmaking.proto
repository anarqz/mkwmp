// Final states are decided by the switch at main+0x139183c once the stream
// has ended with OK; state 7 is handled per message.
enum MatchmakingTicketState {
  MATCHMAKING_TICKET_STATE_UNSPECIFIED = 0;
  // 1 and 2 have no client code: "not final yet". Names unknown.
  MATCHMAKING_TICKET_STATE_PENDING_1 = 1;
  MATCHMAKING_TICKET_STATE_PENDING_2 = 2;
  // Success: game_session and matched_players are converted.
  MATCHMAKING_TICKET_STATE_MATCHED = 3;
  // "The request has been timed out." Result code 4.
  MATCHMAKING_TICKET_STATE_TIMED_OUT = 4;
  // "The request has failed. cause message: <failure.message>". Result code
  // = failure.code.
  MATCHMAKING_TICKET_STATE_FAILED = 5;
  // "The request has been cancelled." Result code 1; treated as a user cancel.
  MATCHMAKING_TICKET_STATE_CANCELLED = 6;
  // Not final. The client answers with CreateAcceptance (accepted = true
  // when the game installed no handler). Do not send unless CreateAcceptance
  // is implemented.
  MATCHMAKING_TICKET_STATE_ACCEPTANCE_REQUIRED = 7;
  // "The match has been declined." Result code 10.
  MATCHMAKING_TICKET_STATE_DECLINED = 8;
}

