// nn.npln.matchmaking.v1: automatch tickets, private rooms, room ids.
// Recovered from mkw-recomp main.bin. Message classes (serializer = vtable
// slot 12):
//   game session service  vtables main+0x30ff328..0x30ffc28 (19 classes)
//   matchmaker            vtables main+0x30ffca8..0x30ffe28 (4 classes)
//   resources             vtables main+0x30ffea8..0x3100638 (16 classes)
// GameSessionService stub constructor main+0x14180ac; per-method stub
// references are listed in docs/contracts/rpcs.tsv.
//
// Field numbers and wire types come from the serializers named on each
// message. Names are inferred (the binary has no descriptors) unless a
// comment says otherwise. "captured" = seen in client frames logged by the
// reference server; "live" = accepted by the game. Consumer analysis:
// docs/RE-MAP.md section 3.
//
// There is no Leave or Update RPC: a player leaves by ending the Gamesync
// KeepUserSession stream. ListUserSessions and GetUserSession are in the stub
// but have no caller and no message classes, so they have no contract.
syntax = "proto3";

package nn.npln.matchmaking.v1;

import "google/protobuf/duration.proto";
import "google/protobuf/empty.proto";
import "google/protobuf/timestamp.proto";
import "nn/npln/gamesync/v1/values.proto";

// Resource names (builders main+0x13eb220..0x13ebae0):
//   tenants/current                                   parent
//   tenants/current/users/current                     the calling user
//   tenants/<t>/matchmakingConfigs/<config>           Normal24, Battle24,
//       Survival24, World96, Attraction6, Streamer, Private24 (rooms)
//   tenants/<t>/matchmakingTickets/<id>
//   tenants/<t>/gameSessionCreationTickets/<id>
//   tenants/<t>/gameSessions/<id>
//   tenants/<t>/gameSessions/<g>/userSessions/<u>
//   tenants/<t>/GameSessionShortAliases/<room id>     (capital G, plural)
//   tenants/<t>/gameSessionSearchConfigs/<name>

service Matchmaker {
  // live. The reply needs only `name`.
  rpc CreateMatchmakingTicket(CreateMatchmakingTicketRequest) returns (MatchmakingTicket);
  // live. Every message replaces the client's copy of the ticket; only the
  // last state counts once the stream ends. End every stream with a final
  // state (MATCHED, TIMED_OUT, FAILED, CANCELLED or DECLINED) and OK
  // trailers: OK without a final state is "Unknown error" (2321-0384). The
  // client gives up after 150 s without a message.
  rpc TrackMatchmakingTicket(TrackMatchmakingTicketRequest) returns (stream MatchmakingTicket);
  // Sent when the player backs out of a search (callback FUN_01392a60).
  // The client does not read the reply; its class was not identified
  // (inferred Empty). Answer, then finish the Track stream with CANCELLED.
  rpc CancelMatchmakingTicket(CancelMatchmakingTicketRequest) returns (google.protobuf.Empty);
  // Sent only in reaction to state ACCEPTANCE_REQUIRED. Reply class not
  // identified (inferred Empty).
  rpc CreateAcceptance(CreateAcceptanceRequest) returns (google.protobuf.Empty);
}

service GameSessionService {
  // Private room, step 1. The reply needs only `name`.
  rpc CreateGameSessionCreationTicket(CreateGameSessionCreationTicketRequest) returns (GameSessionCreationTicket);
  // Private room, step 2. Finish with state CREATED carrying game_session
  // and one MatchedPlayer per local user, then OK trailers. The client
  // gives up after 120 s without a message.
  rpc TrackGameSessionCreationTicket(TrackGameSessionCreationTicketRequest) returns (stream GameSessionCreationTicket);
  // 120 s deadline or user cancel. Reply class not identified (inferred Empty).
  rpc CancelGameSessionCreationTicket(CancelGameSessionCreationTicketRequest) returns (google.protobuf.Empty);
  // Join by Room ID, after GetGameSessionShortAlias.
  rpc GetGameSession(GetGameSessionRequest) returns (GameSession);
  // Friend list: the sessions named by friends' presence attribute
  // `SessionId`, at most every 10 s.
  rpc BatchGetGameSessions(BatchGetGameSessionsRequest) returns (BatchGetGameSessionsResponse);
  rpc QueryGameSessions(QueryGameSessionsRequest) returns (QueryGameSessionsResponse);
  // Errors are gRPC statuses; there is no in-band "wrong password".
  rpc JoinGameSession(JoinGameSessionRequest) returns (JoinGameSessionResponse);
  // Join through a reservation (companion flow).
  rpc IssueMatchmakingIdToken(IssueMatchmakingIdTokenRequest) returns (IssueMatchmakingIdTokenResponse);
  rpc IssueUserDelegationToken(IssueUserDelegationTokenRequest) returns (IssueUserDelegationTokenResponse);
  // Room ID: the server invents the id and returns it in `name`.
  rpc CreateGameSessionShortAlias(CreateGameSessionShortAliasRequest) returns (GameSessionShortAlias);
  // Called twice per join by id (check, then join). NOT_FOUND when unknown.
  rpc GetGameSessionShortAlias(GetGameSessionShortAliasRequest) returns (GameSessionShortAlias);
  // live. After a session is obtained, before Gamesync.
  rpc AllocateIceServerSet(AllocateIceServerSetRequest) returns (IceServerSet);
  // live with an empty reply. Before automatch / create / join.
  rpc ListLatencyMeasurementServers(ListLatencyMeasurementServersRequest) returns (ListLatencyMeasurementServersResponse);
}

