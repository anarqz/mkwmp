// nn.npln.friends.v1: friend list and presence (who is online, in which room).
// Recovered from mkw-recomp main.bin. Message classes (serializer = vtable
// slot 12):
//   friends    vtables main+0x30eb9c0..0x30ebc40 (6 classes)
//   presence   vtables main+0x30ebcc0..0x30ec1c0 (11 classes)
//   resources  vtables main+0x30ec240..0x30ec4d0 (5 classes + map entry)
//
// Field numbers and wire types come from the serializers named on each
// message. Names are inferred (the binary has no descriptors) unless a
// comment says otherwise. "captured" = seen in client frames logged by the
// reference server (scratch/presence-stream.log). Consumer analysis:
// docs/RE-MAP.md part A.2.
//
// How the game uses this (docs/RE-MAP.md 2.3):
//   1. The friend list itself comes from the console (nn::friends). A user
//      that is not a console friend can never appear.
//   2. SubscribeFriendUsers maps console account ids to NPLN users.
//   3. SubscribePresences delivers each friend's state and attributes; the
//      attribute `SessionId` names the room the friend is in.
//   4. The game then calls matchmaking BatchGetGameSessions with those ids
//      and joins with JoinGameSession.
//   5. The game publishes its own `SessionId` (plus `DriverId`, `StickerId`)
//      over KeepAlive.
//
// ListFriendUsers and ListBlockingUsers are in the stub but have no caller
// and no message classes in the binary, so they have no contract.
syntax = "proto3";

package nn.npln.friends.v1;

import "google/protobuf/duration.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";
import "nn/npln/gamesync/v1/values.proto";

service Friends {
  // live with an empty reply. Once at sign-in.
  rpc ActivateUser(ActivateUserRequest) returns (ActivateUserResponse);
  // Server stream; handler FUN_01213f40 -> FUN_01206a40. Shape only: the
  // reference server sends one empty message and keeps the stream open
  // (live: accepted, friend list stays empty).
  rpc SubscribeFriendUsers(SubscribeFriendUsersRequest) returns (stream SubscribeFriendUsersResponse);
}

service PresenceService {
  // Bidi. Writer FUN_012294c0, reader FUN_01227d20. The client sends
  // `open` first and then WAITS for an `ack` before it sends anything else;
  // an empty reply is not an ack (live: with empty replies the client only
  // ever repeats `open`).
  rpc KeepAlive(stream KeepAliveRequest) returns (stream KeepAliveResponse);
  // Server stream; handler FUN_012215c0. Shape only: the reference server
  // sends one empty message and keeps the stream open.
  rpc SubscribePresences(SubscribePresencesRequest) returns (stream SubscribePresencesResponse);
}

