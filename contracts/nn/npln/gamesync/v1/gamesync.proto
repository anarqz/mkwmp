// Consumer FUN_01271c00. Value 3 is not handled by the client.
enum OpKind {
  OP_KIND_UNSPECIFIED = 0;
  // Completes the client's pending add-target future.
  OP_KIND_SUCCEEDED = 1;
  // The target is in sync: the listener's "current" callback runs. The
  // reference server sends CURRENT, then SUCCEEDED, after the initial
  // ADDED changes.
  OP_KIND_CURRENT = 2;
