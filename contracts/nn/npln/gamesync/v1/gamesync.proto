service Gamesync {
  // live.
  rpc IssueToken(IssueTokenRequest) returns (IssueTokenResponse);
  // Shape only; same messages as IssueToken.
  rpc RefreshToken(RefreshTokenRequest) returns (RefreshTokenResponse);
  // live. The response is the Document itself (FUN_012a0c00 parses its
  // field 1 as the document name). A document that does not exist is
  // answered with an empty message by the reference server.
  rpc GetDocument(GetDocumentRequest) returns (Document);
  // live.
  rpc WriteDocuments(WriteDocumentsRequest) returns (WriteDocumentsResponse);
  // live. Bidi; reader FUN_01271c00, call site main+0x1273d20.
  rpc KeepUserSession(stream KeepUserSessionRequest) returns (stream KeepUserSessionResponse);
}

