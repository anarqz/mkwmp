## mkwmp launcher settings. The launcher window creates and edits this file
## (client.toml next to the launcher); you only need it for --headless or
## options the window doesn't show. Guides: https://anarqz.github.io/mkwmp/

server = "https://mkw.anarqz.dev"  # seat server URL (the official one)
name = "Player1"                   # gamertag: 3-16 letters, digits, '-' or '_'; registered on the server
pin = ""                           # its 6-digit PIN (REGISTER in the window fills this in)
game = "C:/Games/mkw"              # game folder containing mkw.exe

# Friends are kept on the server: add them in the launcher window.

# launch = false     # don't start the game (SteamOS: start it from Steam)
# seat = "online"    # take a seat only when you go online in the game ("start" = at launch)
# update = false     # don't update the launcher and game patch from GitHub Releases
# local_port = 47820 # where the game reaches the launcher (127.0.0.1)
# slot = 2           # loopback testing only: the second instance on one PC
