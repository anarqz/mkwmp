## mkwmp client config. Copy this to <game dir>\mkwmp.toml (next to mkw.exe).
## The probe (winmm.dll) reads it directly at startup -- there is no launcher.
## If the file is absent, the game launches stock/offline.

server = "127.0.0.1:8905"      # mkwmp server to join (host:port)
name = "Player1"               # your username; must be unique on the server

# slot: only for running two instances on one machine (loopback testing).
# Leave it out on a normal setup. Player two sets slot = 2.
# slot = 1
