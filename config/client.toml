## mkwmp client config. Read by the launcher, which sets the probe's environment
## before starting the game. One file per player profile.

[connection]
server = "127.0.0.1:8905"      # mkwmp server to join

[profile]
name = "Player1"               # username; must be unique on the server
slot = 1                       # local account slot (1 or 2 for loopback)
