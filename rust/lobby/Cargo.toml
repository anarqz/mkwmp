[package]
name = "lobby"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[dependencies]
ticket = { path = "../ticket" }
tokio = { workspace = true, features = ["sync", "time", "rt"] }
tracing = "0.1"
uuid = { version = "1", features = ["v4", "v5"] }
rand = "0.8"
hmac = "0.12"
sha2 = "0.10"
base64 = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
tokio = { workspace = true, features = ["sync", "time", "rt", "macros"] }
ed25519-dalek = "2"
