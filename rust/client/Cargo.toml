[package]
name = "client"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[[bin]]
name = "mkwmp-launcher"
path = "src/main.rs"

[dependencies]
tokio = { workspace = true, features = ["time", "signal"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
