[package]
name = "client"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "mkwmp-launcher"
path = "src/main.rs"

[dependencies]
tokio = { workspace = true, features = ["time", "signal", "net"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
axum = "0.7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
rand = "0.8"
base64 = "0.22"
ed25519-dalek = "2"
sha2 = "0.10"
semver = "1"
open = "5"
rfd = "0.18"
eframe = { version = "0.37", default-features = false, features = ["glow", "default_fonts", "wayland", "x11"] }
notify-rust = "4"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_System_Console", "Win32_UI_WindowsAndMessaging", "Win32_Foundation"] }
raw-window-handle = "0.6"
winreg = "0.56.0"

[target.'cfg(any(windows, target_os = "macos"))'.dependencies]
tray-icon = "0.26.1"

[target.'cfg(target_os = "linux")'.dependencies]
ksni = "0.3.7"
