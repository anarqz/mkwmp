[package]
name = "seat"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[dependencies]
config.workspace = true
ticket = { path = "../ticket" }
tokio = { workspace = true, features = ["net", "signal", "time"] }
axum = "0.7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rand = "0.8"
ed25519-dalek = "2"
argon2 = "0.5"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
