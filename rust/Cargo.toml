[workspace]
resolver = "2"
members = ["config", "contracts", "ticket", "seat", "lobby", "gateway", "client", "mkwmp"]

[workspace.package]
edition = "2021"
license = "MIT"

[workspace.dependencies]
tonic = "0.12"
tonic-build = "0.12"
prost = "0.13"
prost-types = "0.13"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
contracts = { path = "contracts" }
config = { path = "config" }
