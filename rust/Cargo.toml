[workspace]
resolver = "2"
members = ["config", "contracts", "ticket", "beholder", "seat", "lobby", "gateway", "client", "mkwmp"]

[workspace.package]
version = "1.5.0"
edition = "2021"
license = "GPL-3.0-or-later"

[workspace.dependencies]
tonic = "0.12"
tonic-build = "0.12"
prost = "0.13"
prost-types = "0.13"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
contracts = { path = "contracts" }
config = { path = "config" }
