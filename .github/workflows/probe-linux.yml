# Keeps the probe's platform-neutral core portable while mkw-recomp's plugin API does not exist yet
# (resources/docs/PLUGIN-API-READINESS.md): the core must build as a Linux shared object with no Windows
# dependency, and the Windows winmm.dll must still build. Nothing is uploaded or released.
name: probe-linux

on:
  push:
    branches: [probe-plat]
    paths: ["native/probe/**", ".github/workflows/probe-linux.yml"]
  pull_request:
    paths: ["native/probe/**", ".github/workflows/probe-linux.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Zig from ziglang.org, checked against its published SHA-256 (download/index.json). No setup action: every
      # mlugg/setup-zig release so far (v2.2.1) still runs on the deprecated Node 20.
      - name: Zig 0.15.2
        env:
          ZIG: zig-x86_64-linux-0.15.2
          ZIG_SHA256: 02aa270f183da276e5b5920b1dac44a63f1a49e55050ebde3aecc9eb82f93239
        run: |
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/$ZIG.tar.xz" "https://ziglang.org/download/0.15.2/$ZIG.tar.xz"
          echo "$ZIG_SHA256  $RUNNER_TEMP/$ZIG.tar.xz" | sha256sum -c -
          tar -xJf "$RUNNER_TEMP/$ZIG.tar.xz" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/$ZIG" >> "$GITHUB_PATH"
          echo "ZIG_GLOBAL_CACHE_DIR=$RUNNER_TEMP/zig-cache" >> "$GITHUB_ENV"
          echo "ZIG_LOCAL_CACHE_DIR=$RUNNER_TEMP/zig-cache" >> "$GITHUB_ENV"
      - name: Linux core (.so, -Werror, --no-undefined)
        run: python3 -I native/probe/build_linux.py
      - name: Windows probe (winmm.dll)
        run: python3 -I native/probe/build.py
